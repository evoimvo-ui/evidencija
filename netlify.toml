[build]
  publish = "."
  functions = "netlify/functions"
  [build.environment]
    SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://browser.sentry-cdn.com https://cdn.jsdelivr.net https://cdn.paddle.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https://ei-apps.com https://www.ei-apps.com; connect-src 'self' https://firestore.googleapis.com https://*.googleapis.com https://hook.eu1.make.com https://sentry.io https://*.sentry.io https://paddle.com https://api.paddle.com https://wa.me; frame-ancestors 'none'"
    X-Frame-Options = "ALLOW-FROM https://sandbox-buy.paddle.com"
